export type DecisionConfig = {
  readonly volMin: number;
  readonly volMax: number;
  readonly baseDetWeight: number;
  readonly minDetWeight: number;
  readonly killSwitchThreshold: number;
};

export type DecisionInput = {
  readonly detScore: number;
  readonly riskSafetyScore: number;
  readonly currentVolatility: number;
  readonly criticalRiskTriggered: boolean;
};

export type DecisionOutput = {
  readonly finalScore: number;
  readonly weights: {
    readonly detWeight: number;
    readonly riskWeight: number;
  };
  readonly isBlocked: boolean;
  readonly reason: string;
};

export class DynamicDecisionEngine {
  constructor(
    private readonly config: DecisionConfig
  ) {
    this.validateConfig();
  }

  private validateConfig(): void {
    const {
      volMin,
      volMax,
      baseDetWeight,
      minDetWeight,
      killSwitchThreshold
    } = this.config;

    if (!Number.isFinite(volMin) ||
        !Number.isFinite(volMax) ||
        volMax <= volMin) {
      throw new Error("INVALID_VOLATILITY_RANGE");
    }

    if (
      !Number.isFinite(baseDetWeight) ||
      !Number.isFinite(minDetWeight) ||
      baseDetWeight < 0 ||
      baseDetWeight > 1 ||
      minDetWeight < 0 ||
      minDetWeight > baseDetWeight
    ) {
      throw new Error("INVALID_WEIGHT_CONFIGURATION");
    }

    if (
      !Number.isFinite(killSwitchThreshold) ||
      killSwitchThreshold < 0 ||
      killSwitchThreshold > 100
    ) {
      throw new Error("INVALID_KILL_SWITCH_THRESHOLD");
    }
  }

  private validateScore(value: number): void {
    if (!Number.isFinite(value) || value < 0 || value > 100) {
      throw new Error("INVALID_SCORE");
    }
  }

  private calculateAlpha(volatility: number): number {
    if (!Number.isFinite(volatility)) {
      throw new Error("INVALID_VOLATILITY");
    }

    const {
      volMin,
      volMax
    } = this.config;

    const raw =
      (volatility - volMin) /
      (volMax - volMin);

    const v = Math.max(
      0,
      Math.min(1, raw)
    );

    return v * v * (3 - 2 * v);
  }

  public evaluate(
    input: DecisionInput
  ): DecisionOutput {

    this.validateScore(input.detScore);
    this.validateScore(input.riskSafetyScore);

    if (input.criticalRiskTriggered) {
      return {
        finalScore: 0,
        weights: {
          detWeight: 0,
          riskWeight: 1
        },
        isBlocked: true,
        reason: "CRITICAL_RISK_TRIGGERED"
      };
    }

    if (
      input.riskSafetyScore <
      this.config.killSwitchThreshold
    ) {
      return {
        finalScore: 0,
        weights: {
          detWeight: 0,
          riskWeight: 1
        },
        isBlocked: true,
        reason: "RISK_SAFETY_THRESHOLD_BREACHED"
      };
    }

    const alpha =
      this.calculateAlpha(
        input.currentVolatility
      );

    const detWeight =
      this.config.baseDetWeight -
      alpha *
      (
        this.config.baseDetWeight -
        this.config.minDetWeight
      );

    const riskWeight =
      1 - detWeight;

    const finalScore =
      (
        input.detScore * detWeight
      ) +
      (
        input.riskSafetyScore * riskWeight
      );

    return {
      finalScore:
        Number(finalScore.toFixed(2)),

      weights: {
        detWeight:
          Number(detWeight.toFixed(4)),

        riskWeight:
          Number(riskWeight.toFixed(4))
      },

      is locked: false,
      reason: "NORMAL_EVALUATION"
    };
  }
}

