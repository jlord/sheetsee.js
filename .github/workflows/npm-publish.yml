Every accepted Gateway request MUST be traceable through:

requestId
correlationId
causationId
actorId
tenantId
decisionId
kernelVersion
ruleVersion
inputHash
outputHash
eventHash
timestamp

Audit records MUST NOT be mutable through ordinary business APIs.

