GUBON 1–9 Numeric Kernel acts as the deterministic execution layer within the system architecture. Its sole purpose is to enforce bounded, finite-state mathematical reduction on heterogeneous input strings before any AI generation or decision graph execution begins.
This process eliminates LLM hallucination in data classification: the AI model never parses or categorizes user demographics or problem scopes on its own. Instead, native TypeScript modules (DecisionEngine.ts) compute an immutable, multi-dimensional Decision Vector composed strictly of single-digit integers (1 \dots 9).
Step-by-Step Normalization Pipeline
Raw User Input
  ├─ Name / Identifier  ─►  [String Normalizer]  ─►  Sum of Unicode / Pinyin  ─► Mod 9  ─► [N] (1–9)
  ├─ Birth Date/Time    ─►  [Timestamp Parser]   ─►  Digital Root / Bazi Stem  ─► Mod 9  ─► [B], [T] (1–9)
  ├─ Location / Region  ─►  [Geohash / ISO 3166] ─►  Coordinate Digit Sum    ─► Mod 9  ─► [R] (1–9)
  └─ Problem Context    ─►  [Zod / Enums Registry]─► Canonical ID Index       ─► Mod 9  ─► [P] (1–9)
                                                                                            │
                                                                                            ▼
                                                                             Decision Vector [N, B, T, R, P]

1. Raw Input Parsing & Standard Extraction
Each input dimension goes through a dedicated deterministic parser:
 * Name Number (N):
   * Non-Latin strings (e.g., Traditional Chinese zh-TW) are converted to standard Pinyin or UTF-8 character codes.
   * Numerical values are extracted, summed, and reduced via a Digital Root algorithm:
     
 * Birth Date Number (B) & Time Number (T):
   * Timestamps are converted to UTC epoch milliseconds or mapped to traditional Stem-Branch (Bazi) matrix indices.
   * Day and hour components are recursively summed into single digits (1 \dots 9).
 * Region Number (R):
   * Geographical names or location codes map to standard ISO-3166 or geohash numeric representations, which are then passed through the digital root formula.
 * Problem Dimension Number (P):
   * The free-text query (e.g., "Deciding on changing jobs") passes through a strict Semantic Parser matching against the Canonical Registry.
   * Unmatched or ambiguous queries return UNRESOLVED (the system halts calculation rather than guessing).
   * Matched inputs map directly to a static Canonical ID (e.g., CAREER_CHANGE \rightarrow Index 6).
2. The 1–9 Semantic Axis Mapping
Once raw inputs reduce to the integer space 1 \dots 9, they map directly to GUBON's fixed 9-archetype matrix. The kernel assigns a consistent semantic axis across all dimensions so that inputs interact predictably:
| Root (1 \dots 9) | Archetype | Primary Focus | Life Cycle Phase | Action Strategy |
|---|---|---|---|---|
| 1 | Initiator (啟動型) | Independence & Origin | Beginning (開始) | Direct Action / First-Mover |
| 2 | Coordinator (協調型) | Relationships & Alignment | Connection (連結) | Consensus / Waiting |
| 3 | Creator (創造型) | Expression & Innovation | Expansion (發展) | Iteration & Divergence |
| 4 | Builder (建構型) | Stability & Structure | Institutionalization (穩定) | Systemization / Discipline |
| 5 | Adapter (變動型) | Exploration & Pivot | Transformation (轉型) | Re-allocation / Adjustment |
| 6 | Steward (承擔型) | Responsibility & Care | Maintenance (承擔) | Risk Containment / Balance |
| 7 | Analyst (洞察型) | Reflection & Investigation | Introspection (反思) | Research & Due Diligence |
| 8 | Executor (執行型) | Resource & High-Yield | Scaling (擴張) | Capitalization / Leverage |
| 9 | Integrator (整合型) | Completion & Synthesis | Transition (收斂) | Consolidation / Closure |
3. Vector Construction & Template Selection
The normalized outputs combine into an immutable payload:
 * Example Computation:
   For an input returning Name = 7, Birth = 8, Time = 5, Region = 2, and Problem = 6 (CAREER_CHANGE):
   * Primary Model: 7 (Analyst Archetype \rightarrow High analysis depth, risk of analysis paralysis).
   * Life Cycle: 5 (Pivot / Transformation phase).
   * Problem Domain: 6 (Stewardship / Risk Containment).
The Kernel uses this vector as a compound lookup key to retrieve a static Contextual Template ID:

4. Deterministic Invariants & Safety Locks
To guarantee that calculations are completely reproducible across environments:
 * No LLM Mathematical Execution: The AI model never computes or transforms numbers. It only receives the final TemplateID, DecisionVector, and structural prompt constraints.
 * State Immutability: Identical user inputs evaluated under the same Kernel version will always output the exact same DecisionVector.
 * Fail-Safe Gate (UNRESOLVED): If an input cannot be validated against the Canonical Registry, the kernel returns an UNRESOLVED status rather than allowing the AI to invent a classification.
// Core TypeScript Contract Representation
export type GubonDigit = 1 | 2 | 3 | 4 | 5 | 6 | 7 | 8 | 9;

export interface DecisionVector {
  readonly primaryModel: GubonDigit; // N
  readonly lifeCycle: GubonDigit;    // B/T
  readonly regionCode: GubonDigit;   // R
  readonly problemDomain: GubonDigit;// P
}

export function computeDigitalRoot(value: number): GubonDigit {
  const root = 1 + ((Math.abs(value) - 1) % 9);
  return root as GubonDigit;
}

By decoupling calculation from narrative generation, the 1–9 Numeric Kernel converts unstructured user context into a deterministic finite-state model that drives the rest of the GUBON execution pipeline.

GUBON Payment Engine executes a strict, multi-stage transaction verification pipeline to process inbound payment webhooks—primarily for PayPal—ensuring absolute financial integrity, preventing replay attacks, and enforcing exact-once fulfillment.

processing lifecycle combines cryptographic header verification, atomic idempotency locks, and transaction guards before modifying system entitlements or updating the immutable Revenue Ledger.
Pipeline Overview
Incoming Webhook Request
         │
         ▼
[ Stage 1: Cryptographic Verification ]
  ├── Extract Headers (Transmission ID, Cert URL, Signature, Transmission Time)
  └── Call PayPal REST API Endpoint (`/v1/notifications/verify-webhook-signature`)
         │
         ├── Invalid Signature ──► Reject Request (400 Bad Request / 401 Unauthorized)
         └── Valid Signature
                 │
                 ▼
[ Stage 2: Atomic Idempotency Lock ]
  ├── Extract Unique Provider Event ID (`event_id`)
  └── Perform Atomic Database Upsert (`idempotency_keys` table)
         │
         ├── Lock Exists / Already Processed ──► Return 200 OK (Skip Duplicate Execution)
         └── Lock Acquired (New Event)
                 │
                 ▼
[ Stage 3: Order State Machine & Transaction Guard ]
  ├── Match Internal Order (`order_id`)
  ├── Verify Amount & Currency Match Internal Order Contract
  └── Check Valid State Transition (`CREATED` / `PENDING` ──► `PAID`)
         │
         ├── Mismatch / Illegal State ──► Log Audit Failure & Abort (No Entitlement)
         └── State Guard Passed
                 │
                 ▼
[ Stage 4: Atomic Fulfillment & Revenue Ledger Write ]
  ├── Transition Order State to `PAID`
  ├── Activate Entitlement (`entitlement.upsert`)
  └── Record Entry in `revenue_ledger`
         │
         ▼
Respond 200 OK

Stage 1: Cryptographic Webhook Signature Verification
Webhooks received at the GUBON API Gateway are treated as unverified payloads until explicit HMAC/cert signature validation is completed against the provider's API.
 * Header Extraction: The gateway extracts required headers supplied by PayPal:
   * PAYPAL-TRANSMISSION-ID
   * PAYPAL-TRANSMISSION-TIME
   * PAYPAL-CERT-URL
   * PAYPAL-TRANSMISSION-SIG
   * PAYPAL-AUTH-ALGO
 * Provider Signature Verification: Rather than relying solely on local public key downloads, the API gateway sends an inline payload verification request to PayPal’s REST API endpoint (/v1/notifications/verify-webhook-signature).
 * Replay & Timestamp Checking: The PAYPAL-TRANSMISSION-TIME is checked against an internal threshold window to mitigate replay attempts. If the signature verification status returns anything other than SUCCESS, the request is immediately dropped and logged to the audit ledger.
Stage 2: Atomic Idempotency Lock
To handle potential duplicate deliveries, network retries, or concurrent webhook pushes from payment providers, GUBON uses database-level idempotency locks backed by PostgreSQL atomic transactions (prisma.$transaction).
 * Unique Key Generation: The lock key is derived directly from the provider's unique event identifier:
   
 * Atomic Record Reservation: The engine attempts an insert/upsert into the idempotency_keys table inside an isolation block:
   * If the event_id already exists with a COMPLETED state, the engine halts further execution and immediately returns an HTTP 200 OK to the payment provider.
   * If the record is currently in a PROCESSING state or does not exist, an exclusive lock is established for the current request context.
// Architectural representation of atomic idempotency locking
async function handleWebhookEvent(event: PayPalWebhookEvent) {
  return await prisma.$transaction(async (tx) => {
    // Attempt lock acquisition on unique event ID
    const existingKey = await tx.idempotencyKey.findUnique({
      where: { key: event.id },
    });

    if (existingKey && existingKey.status === 'COMPLETED') {
      // Event previously processed; short-circuit safely
      return { status: 'SKIPPED_DUPLICATE' };
    }

    // Reserve lock key
    await tx.idempotencyKey.upsert({
      where: { key: event.id },
      create: { key: event.id, status: 'PROCESSING', createdAt: new Date() },
      update: { status: 'PROCESSING' },
    });

    // Proceed to Order & Revenue processing...
  });
}

Stage 3: Order State Machine & Transaction Guards
Once the event signature is verified and the idempotency lock is reserved, the payload passes through GUBON's internal Transaction Guard:
 * Order Validation: The engine looks up the target order using the custom reference ID embedded in the payment payload (custom_id / invoice_id).
 * Contract Consistency Checks:
   * Amount Verification: The captured monetary value in the event payload must strictly match the internal price calculated for the order.
   * Currency Lock: The payment currency (e.g., TWD or USD) must match the order spec.
 * State Machine Transition: Orders must follow a non-reversible state machine:
   
   * If an order is already in PAID or DELIVERED status, the transition is skipped, avoiding redundant downstream operations.
   * Invalid transitions (e.g., attempting to mark a REFUNDED order as PAID) trigger an error response and release the execution lock with a FAILED audit status.
Stage 4: Atomic Entitlement & Revenue Ledger Recording
If all guards pass, the transaction completes within an isolated atomic block:
 * Order State Update: Order status transitions to PAID.
 * Entitlement Unlock: The user's entitlement record (entitlements table) is created or updated, unlocking access to the full decision report or pass duration.
 * Revenue Ledger Entry: An immutable record is committed to revenue_ledger with the verified capture amount, payment processor reference ID, user ID, and transaction timestamp.
 * Lock Completion: The idempotency_keys record is updated to status COMPLETED.
Only after the database transaction successfully commits does the system dispatch asynchronous background jobs (e.g., via BullMQ or LINE OA notification workers) to fulfill report deliveries and trigger customer engagement workflows.

The Simulation Plugin (L5 Evolution / Governance Layer) within GUBON-EX serves as an automated risk management and predictive optimization engine. Its primary job is to evaluate proposed system mutations—such as AI model prompts, pricing adjustments, decision vector weights, or automated execution workflows—before they are fully promoted to production.
When an autonomous mutation is proposed, the Simulation Plugin executes N iterations (typically 10,000) of stochastic Monte Carlo simulations against historical user decision vectors and outcome data. If the simulated failure rate or risk metric exceeds a predefined threshold (such as 1\%), the system enforces an immediate, automated 85% rollback mechanism (a partial or canary rollback down to an 85\% traffic/weight reduction or absolute fallback state) to shield system revenue and operational stability.
Step-by-Step Simulation & Rollback Execution Flow
