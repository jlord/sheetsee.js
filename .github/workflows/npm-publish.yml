3. Cursor Contract 固定

不要使用單純可解碼 Base64 作為安全 Token。

正式模型：

CursorPayload {
  version
  tenantId
  toolId
  queryHash
  sortKey
  expiresAt
  nonce
}

簽章：

signature =
HMAC(
  serverSecret,
  canonical(CursorPayload)
)

實際 Cursor：

base64url(
  canonical(CursorPayload)
  + "."
  + signature
)

驗證必須同時檢查：

version
tenantId
toolId
queryHash
expiresAt
nonce
signature

如此才能防止：

Cross-tenant replay

Query tampering

Cursor forgery

Cursor expiration bypass

Tool substitution



