1. Governance Layer (Event Bus & Agent FSM)
Sovereign Event Bus (NATS JetStream & Redis): Ingests incoming events (e.g., decision.requested, payment.verified) using high-throughput message streaming. Guarantees event ordering, idempotency, and replay capabilities via Hybrid Logical Clocks (HLC).
Agent State Machine (FSM): Enforces strict boundary conditions on AI agents. Agents operate under non-sovereign execution limits—they cannot self-escalate privileges, alter system policies, or bypass audit logging.
2. Decision Layer (Decision Graph & Memory Fabric)
GUBON Numeric Kernel (1–9 Deterministic Pipeline): Converts multi-dimensional inputs (Name, Birth, Time, Region, Problem) into standardized single-digit roots (1 \dots 9). This forms the Decision Vector without relying on unpredictable LLM calculations.
Contextual Template Selector & AI Router: Maps the Decision Vector to predefined story templates. Structured outputs are routed to AI providers (Gemini, OpenAI, Anthropic) under strict schema enforcement (zodResponseFormat).
Memory Fabric: Maintains system memory across operational stores (PostgreSQL for transactional truth, Qdrant/pgvector for semantic memory, and Redis for short-term state).
3. Revenue & Execution Layer (Simulation & Monitoring)
Revenue Engine & Entitlement: Handles payment webhooks, signature checks, and transaction idempotency. Unlocks full decision reports only upon verified payment confirmation.
Simulation Engine (Monte Carlo & Empirical Evolution): Runs predictive simulations against historical outcome vectors. If predicted failure rates exceed threshold limits (e.g., >1\%), automated rollback mechanisms are triggered.
Observability & Monitoring: Tracks system metrics, API latencies, worker health, and revenue ledgers in real time.
