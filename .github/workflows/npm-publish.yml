export type GubonDigit =
  1 | 2 | 3 | 4 | 5 | 6 | 7 | 8 | 9;

export interface DecisionVector {
  readonly name: GubonDigit;
  readonly birth: GubonDigit;
  readonly time: GubonDigit;
  readonly region: GubonDigit;
  readonly problem: GubonDigit;
  readonly kernelVersion: string;
}

export function computeDigitalRoot(value: number): GubonDigit {
  if (!Number.isFinite(value)) {
    throw new Error("INVALID_NUMERIC_INPUT");
  }

  const normalized = Math.abs(Math.trunc(value));

  return (1 + ((normalized - 1) % 9)) as GubonDigit;
}

