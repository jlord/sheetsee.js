1. 跨線程安全派發器 (AdMainThreadDispatcher.cs)
using System;
using System.Collections.Generic;
using UnityEngine;

namespace GUBON.Ads.Core
{
    public class AdMainThreadDispatcher : MonoBehaviour
    {
        private static readonly Queue<Action> _executionQueue = new Queue<Action>();
        private static AdMainThreadDispatcher _instance;

        private void Awake()
        {
            if (_instance != null && _instance != this) { Destroy(gameObject); return; }
            _instance = this;
            DontDestroyOnLoad(gameObject);
        }

        private void Update()
        {
            lock (_executionQueue)
            {
                while (_executionQueue.Count > 0) _executionQueue.Dequeue()?.Invoke();
            }
        }

        public static void Enqueue(Action action)
        {
            if (action == null) return;
            lock (_executionQueue) { _executionQueue.Enqueue(action); }
        }
    }
}

2. UMP 隱私與初始化閘門 (AdPrivacyGate.cs)
using System;
using GoogleMobileAds.Api;
using GoogleMobileAds.Ump.Api;
using UnityEngine;

namespace GUBON.Ads.Privacy
{
    public class AdPrivacyGate
    {
        public static void InitializePrivacyAndAds(Action<bool> onComplete)
        {
            var requestParameters = new ConsentRequestParameters { TagForUnderAgeOfConsent = false };

            ConsentInformation.Update(requestParameters, consentError =>
            {
                if (consentError != null)
                {
                    EvaluateConsentAndInitialize(onComplete);
                    return;
                }

                ConsentForm.LoadAndShowConsentFormIfRequired(formError =>
                {
                    EvaluateConsentAndInitialize(onComplete);
                });
            });
        }

        private static void EvaluateConsentAndInitialize(Action<bool> onComplete)
        {
            if (ConsentInformation.CanRequestAds())
            {
                MobileAds.Initialize(initStatus => onComplete?.Invoke(true));
            }
            else
            {
                onComplete?.Invoke(false);
            }
        }
    }
}

3. Rewarded Ad 防重複核銷與狀態機 (RewardedAdController.cs)
using System;
using GoogleMobileAds.Api;
using GUBON.Ads.Core;

namespace GUBON.Ads.Controllers
{
    public class RewardedAdController
    {
        private RewardedAd _rewardedAd;
        private readonly string _adUnitId;
        private bool _isRewardEarned;
        private string _activeTransactionId;

        public event Action<string, Reward> OnRewardValidated;

        public RewardedAdController(string adUnitId) => _adUnitId = adUnitId;

        public void LoadAd()
        {
            _rewardedAd?.Destroy();
            _rewardedAd = null;

            RewardedAd.Load(_adUnitId, new AdRequest(), (ad, error) =>
            {
                if (error != null) return;
                _rewardedAd = ad;
                RegisterEvents(_rewardedAd);
            });
        }

        public void ShowAd(string transactionId)
        {
            if (_rewardedAd != null && _rewardedAd.CanShowAd())
            {
                _activeTransactionId = transactionId;
                _isRewardEarned = false;
                _rewardedAd.Show(reward => _isRewardEarned = true);
            }
        }

        private void RegisterEvents(RewardedAd ad)
        {
            ad.OnAdFullScreenContentClosed += () =>
            {
                AdMainThreadDispatcher.Enqueue(() =>
                {
                    if (_isRewardEarned)
                    {
                        OnRewardValidated?.Invoke(_activeTransactionId, ad.GetRewardItem());
                    }
                    LoadAd();
                });
            };

            ad.OnAdFullScreenContentFailed += (error) =>
            {
                AdMainThreadDispatcher.Enqueue(() => LoadAd());
            };
        }
    }
}

